# CogniLab 独立站点（手动维护，不依赖宝塔站点配置）。
# 将本文件放到 /www/server/panel/vhost/nginx/cognilab.conf。
# 公网主机名：cognilab.cd-here.cn（A 记录已指向 47.109.176.71）。
# 使用已备案的 cd-here.cn 子域，避免阿里云未备案域名拦截。
# 证书使用 DNS-01 一次性签发，未配置自动续签。
map $http_upgrade $cognilab_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name cognilab.cd-here.cn;

    # Let's Encrypt / acme.sh HTTP-01 验证目录
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/cognilab-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name cognilab.cd-here.cn;

    ssl_certificate     /etc/cognilab-tls/fullchain.pem;
    ssl_certificate_key /etc/cognilab-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:cognilab_ssl:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /www/wwwlogs/cognilab.log;
    error_log  /www/wwwlogs/cognilab.error.log;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Real-Port $remote_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cognilab_connection_upgrade;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        client_max_body_size 4m;
    }
}
